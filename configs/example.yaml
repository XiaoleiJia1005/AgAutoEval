# AgAutoEval Example Configuration
# Usage: python -m agautoeval configs/example.yaml

agent:
  type: opencode
  install_cmd: "npm install -g opencode-ai"
  command: "opencode run --auto -m deepseek/deepseek-v4-pro {problem_statement}"
  env:
    DEEPSEEK_API_KEY: sk-486a12b396c04b6f87ef8ee2310d2ab3
  timeout: 1800
  persist:                  # Auto-mount container paths to host (optional)
    - /root/.local/share/            #   → {instance_id}/mounts/workspace

sandbox:
  mode: prebuilt
  repo_path: /testbed
  image: "swebench/sweb.eval.x86_64.{instance_id|split:__:0}_1776_{instance_id|split:__:1}"
  setup_commands:
    - "pip install -q pytest"
  cleanup_image: true


# provider: local | huggingface | url
dataset:
  provider: local
  path: swe_verified.json
  type: swe_bench

execution:
  max_workers: 4
  timeout: 3600
  retries: 0

output:
  dir: results
  log_level: INFO
