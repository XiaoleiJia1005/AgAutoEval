# AgAutoEval Example Configuration — Claude Code
# Usage: python -m agautoeval configs/example_claude.yaml

agent:
  type: claude
  install_cmd: "npm install -g @anthropic-ai/claude-code"
  version_cmd: "claude --version"
  command: "claude --dangerously-skip-permissions -p {problem_statement} --output-format stream-json"
  env:
    ANTHROPIC_API_KEY: sk-ant-xxxxxxxxxxxxx
  timeout: 1800
  persist:                  # Persist agent logs/messages to host
    - /root/.claude/        #   session JSONL logs, settings, credentials
    - /root/.claude.json    #   global config

sandbox:
  mode: prebuilt
  repo_path: /testbed
  image: "swebench/sweb.eval.x86_64.{instance_id|split:__:0}_1776_{instance_id|split:__:1}"
  setup_commands:
    - "conda create -n py38 python=3.8 -y -q"
    - "/opt/miniconda3/envs/py38/bin/pip install -q pytest"
  python_bin: "/opt/miniconda3/envs/py38/bin/python"
  cleanup_image: true
  auto_pull_image: true

dataset:
  provider: huggingface
  path: SWE-bench/SWE-bench_Verified
  type: swe_bench

execution:
  max_workers: 1
  timeout: 3600
  retries: 0


