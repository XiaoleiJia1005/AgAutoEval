# AgAutoEval Example Configuration
# Usage: python -m agautoeval configs/example.yaml

agent:
  type: opencode
  model: deepseek-v4-pro 
  provider: deepseek
  install_cmd: "npm install -g opencode-ai"
  version_cmd: "opencode --version"
  command: "opencode run --dangerously-skip-permissions  -m {provider}/{model} {problem_statement}"
  env:
    DEEPSEEK_API_KEY: sk-486a12b396c04b6f87ef8ee2310d2ab3
  timeout: 1800
  persist:                  # Auto-mount container paths to host (optional)
    - /root/.local/share/            #   → {instance_id}/mounts/workspace

sandbox:
  mode: prebuilt
  repo_path: /testbed
  image: "swebench/sweb.eval.x86_64.{instance_id|split:__:0}_1776_{instance_id|split:__:1}"
  setup_commands:
    - "conda create -n py38 python=3.8 -y -q"
    - "/opt/miniconda3/envs/py38/bin/pip install -q pytest"
  python_bin: "/opt/miniconda3/envs/py38/bin/python"
  cleanup_image: true
  auto_pull_image: true    # auto-pull image if not present locally


# provider: local | huggingface | url
dataset:
  provider: huggingface
  path: SWE-bench/SWE-bench_Verified
  type: swe_bench

execution:
  max_workers: 1
  timeout: 3600
  retries: 0


