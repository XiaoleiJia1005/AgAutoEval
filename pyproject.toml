[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agautoeval"
version = "0.1.0"
description = "Automatic Agent Evaluation Harness for coding agents"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "tqdm>=4.60",
    "docker>=6.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
]

[project.scripts]
agautoeval = "agautoeval.__main__:main"

[tool.setuptools.packages.find]
include = ["agautoeval*"]
